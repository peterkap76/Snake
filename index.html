<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#2b3a1f">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<title>Snake</title>
<style>
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; user-select: none; }
  html, body {
    margin: 0; height: 100%; background: #1a1a1a;
    font-family: "Courier New", monospace; overflow: hidden; touch-action: none;
  }
  #phone {
    height: 100%; display: flex; flex-direction: column;
    align-items: center; justify-content: center; gap: 14px; padding: 10px;
  }
  #screen {
    position: relative;
    background: #9bbc0f; border: 8px solid #2b3a1f; border-radius: 14px;
    padding: 8px; box-shadow: inset 0 0 20px rgba(0,0,0,.35), 0 0 0 4px #444;
  }
  #hud {
    display: flex; justify-content: space-between; align-items: center; color: #1f2d0c;
    font-weight: bold; font-size: 15px; margin-bottom: 6px; letter-spacing: 1px;
  }
  #listBtn {
    background: #1f2d0c; color: #9bbc0f; border: none; border-radius: 6px;
    padding: 3px 8px; font-family: inherit; font-weight: bold; font-size: 13px;
  }
  canvas { display: block; background: #9bbc0f; border: 2px solid #1f2d0c; }

  #scores {
    display: none; position: absolute; left: 8px; right: 8px; top: 8px; bottom: 8px;
    background: #9bbc0f; color: #1f2d0c; padding: 10px; overflow-y: auto; z-index: 5;
  }
  #scores h2 { margin: 0 0 8px; text-align: center; font-size: 20px; letter-spacing: 2px; }
  #scores table { width: 100%; border-collapse: collapse; font-size: 13px; }
  #scores th { text-align: left; border-bottom: 2px solid #1f2d0c; padding: 3px 2px; }
  #scores td { padding: 4px 2px; border-bottom: 1px dotted #4f6b13; }
  #scores td.pts { font-weight: bold; text-align: right; }
  #scores tr.new { background: #1f2d0c; color: #9bbc0f; }
  #scores .empty { text-align: center; margin: 30px 0; }
  .sbtns { display: flex; gap: 8px; justify-content: center; margin-top: 12px; }
  .sbtns button {
    background: #1f2d0c; color: #9bbc0f; border: none; border-radius: 6px;
    padding: 8px 14px; font-family: inherit; font-weight: bold; font-size: 14px;
  }

  #pad { display: grid; grid-template-columns: repeat(3, 70px); grid-template-rows: repeat(2, 60px); gap: 8px; }
  .btn {
    background: #333; color: #9bbc0f; border: 2px solid #555; border-radius: 12px;
    font-size: 26px; display: flex; align-items: center; justify-content: center;
  }
  .btn:active { background: #555; }
  #up { grid-column: 2; grid-row: 1; }
  #left { grid-column: 1; grid-row: 2; }
  #down { grid-column: 2; grid-row: 2; }
  #right { grid-column: 3; grid-row: 2; }
</style>
</head>
<body>
<div id="phone">
  <div id="screen">
    <div id="hud">
      <span>PUNKTE: <span id="score">0</span></span>
      <button id="listBtn">🏆</button>
      <span>REKORD: <span id="best">0</span></span>
    </div>
    <canvas id="game" width="320" height="320"></canvas>

    <div id="scores">
      <h2>HIGHSCORES</h2>
      <div id="scoreTable"></div>
      <div class="sbtns">
        <button id="closeScores">Zurück</button>
        <button id="clearScores">Löschen</button>
      </div>
    </div>
  </div>

  <div id="pad">
    <div class="btn" id="up">▲</div>
    <div class="btn" id="left">◀</div>
    <div class="btn" id="down">▼</div>
    <div class="btn" id="right">▶</div>
  </div>
</div>

<script>
const canvas = document.getElementById('game');
const ctx = canvas.getContext('2d');
const scoreEl = document.getElementById('score');
const bestEl = document.getElementById('best');
const scoresBox = document.getElementById('scores');
const scoreTable = document.getElementById('scoreTable');

const COLS = 16, ROWS = 16, SIZE = 20;
const DARK = '#1f2d0c', MID = '#4f6b13', LIGHT = '#9bbc0f';
const STORE = 'snakeHighscores';

let snake, dir, nextDir, food, score, state, timer, tick = 0, lastId = null;
let scores = loadScores();

function loadScores() {
  try { return JSON.parse(localStorage.getItem(STORE)) || []; }
  catch (e) { return []; }
}
function saveScores() {
  try { localStorage.setItem(STORE, JSON.stringify(scores)); } catch (e) {}
}
function updateBest() { bestEl.textContent = scores.length ? scores[0].score : 0; }

function fmtDate(ts) {
  const d = new Date(ts);
  const p = n => String(n).padStart(2, '0');
  return p(d.getDate()) + '.' + p(d.getMonth() + 1) + '.' + d.getFullYear() +
         ' ' + p(d.getHours()) + ':' + p(d.getMinutes());
}

function addScore(pts) {
  if (pts <= 0) return;
  const entry = { id: Date.now(), score: pts, ts: Date.now() };
  scores.push(entry);
  scores.sort((a, b) => b.score - a.score || a.ts - b.ts);
  scores = scores.slice(0, 10);
  lastId = entry.id;
  saveScores();
  updateBest();
}

function renderScores() {
  if (!scores.length) {
    scoreTable.innerHTML = '<div class="empty">Noch keine Einträge.<br>Spiel eine Runde!</div>';
    return;
  }
  let html = '<table><tr><th>#</th><th>Datum / Uhrzeit</th><th style="text-align:right">Pkt</th></tr>';
  scores.forEach((s, i) => {
    html += '<tr class="' + (s.id === lastId ? 'new' : '') + '"><td>' + (i + 1) +
            '</td><td>' + fmtDate(s.ts) + '</td><td class="pts">' + s.score + '</td></tr>';
  });
  scoreTable.innerHTML = html + '</table>';
}

function showScores() {
  if (state === 'play') pauseGame();
  renderScores();
  scoresBox.style.display = 'block';
}
function hideScores() { scoresBox.style.display = 'none'; }

document.getElementById('listBtn').addEventListener('click', showScores);
document.getElementById('closeScores').addEventListener('click', hideScores);
document.getElementById('clearScores').addEventListener('click', () => {
  if (confirm('Alle Highscores löschen?')) {
    scores = []; lastId = null; saveScores(); updateBest(); renderScores();
  }
});

function reset() {
  snake = [{x: 8, y: 8}, {x: 7, y: 8}, {x: 6, y: 8}];
  dir = {x: 1, y: 0}; nextDir = dir;
  score = 0; scoreEl.textContent = 0;
  placeFood();
}

function placeFood() {
  do {
    food = { x: Math.floor(Math.random() * COLS), y: Math.floor(Math.random() * ROWS) };
  } while (snake.some(s => s.x === food.x && s.y === food.y));
}

function start() {
  reset(); lastId = null; state = 'play';
  clearInterval(timer);
  timer = setInterval(step, 130);
}

function pauseGame() {
  if (state !== 'play') return;
  state = 'pause'; clearInterval(timer);
}
function resumeGame() {
  if (state !== 'pause') return;
  state = 'play'; clearInterval(timer);
  timer = setInterval(step, Math.max(70, 130 - Math.floor(score / 5) * 4));
}

function step() {
  tick++;
  dir = nextDir;
  const head = { x: snake[0].x + dir.x, y: snake[0].y + dir.y };

  if (head.x < 0 || head.y < 0 || head.x >= COLS || head.y >= ROWS ||
      snake.some(s => s.x === head.x && s.y === head.y)) {
    state = 'over'; clearInterval(timer);
    addScore(score);
    draw(); return;
  }

  snake.unshift(head);
  if (head.x === food.x && head.y === food.y) {
    score++; scoreEl.textContent = score; placeFood();
    clearInterval(timer);
    timer = setInterval(step, Math.max(70, 130 - Math.floor(score / 5) * 4));
  } else {
    snake.pop();
  }
  draw();
}

function turn(dx, dy) {
  if (state !== 'play') return;
  if (dx === -dir.x && dy === -dir.y) return;
  nextDir = { x: dx, y: dy };
}

/* ---------- Zeichnen ---------- */
function drawApple(f) {
  const cx = f.x * SIZE + SIZE / 2, cy = f.y * SIZE + SIZE / 2 + 1;
  ctx.fillStyle = DARK;
  ctx.beginPath(); ctx.arc(cx, cy, 7.5, 0, Math.PI * 2); ctx.fill();
  ctx.fillStyle = LIGHT;
  ctx.beginPath(); ctx.arc(cx - 2.5, cy - 2.5, 1.8, 0, Math.PI * 2); ctx.fill();
  ctx.strokeStyle = DARK; ctx.lineWidth = 2;
  ctx.beginPath(); ctx.moveTo(cx, cy - 6); ctx.lineTo(cx + 1, cy - 10); ctx.stroke();
  ctx.fillStyle = MID;
  ctx.beginPath(); ctx.ellipse(cx + 4, cy - 8, 3.5, 1.8, -0.5, 0, Math.PI * 2); ctx.fill();
}

function drawBody(seg, i) {
  const x = seg.x * SIZE, y = seg.y * SIZE;
  ctx.fillStyle = i % 2 ? MID : DARK;
  ctx.beginPath();
  ctx.roundRect(x + 1, y + 1, SIZE - 2, SIZE - 2, 6);
  ctx.fill();
  ctx.fillStyle = LIGHT;
  ctx.beginPath(); ctx.arc(x + SIZE / 2, y + SIZE / 2, 2, 0, Math.PI * 2); ctx.fill();
}

function drawTail(seg, prev) {
  const x = seg.x * SIZE + SIZE / 2, y = seg.y * SIZE + SIZE / 2;
  const ang = Math.atan2(seg.y - prev.y, seg.x - prev.x);
  ctx.save();
  ctx.translate(x, y); ctx.rotate(ang);
  ctx.fillStyle = DARK;
  ctx.beginPath();
  ctx.moveTo(-SIZE / 2, -7); ctx.lineTo(SIZE / 2 + 2, 0); ctx.lineTo(-SIZE / 2, 7);
  ctx.closePath(); ctx.fill();
  ctx.restore();
}

function drawHead() {
  const h = snake[0];
  const cx = h.x * SIZE + SIZE / 2, cy = h.y * SIZE + SIZE / 2;
  const ang = Math.atan2(dir.y, dir.x);
  const near = Math.abs(food.x - h.x) + Math.abs(food.y - h.y) <= 2;

  ctx.save();
  ctx.translate(cx, cy); ctx.rotate(ang);

  // Zunge
  if (!near && state === 'play' && tick % 6 < 3) {
    ctx.strokeStyle = DARK; ctx.lineWidth = 1.5;
    ctx.beginPath();
    ctx.moveTo(9, 0); ctx.lineTo(14, 0);
    ctx.moveTo(14, 0); ctx.lineTo(17, -2.5);
    ctx.moveTo(14, 0); ctx.lineTo(17, 2.5);
    ctx.stroke();
  }

  // Kopfform
  ctx.fillStyle = DARK;
  ctx.beginPath(); ctx.ellipse(1, 0, 10, 8, 0, 0, Math.PI * 2); ctx.fill();

  // Maul
  if (near) {
    ctx.fillStyle = LIGHT;
    ctx.beginPath(); ctx.moveTo(4, 0); ctx.lineTo(11, -5); ctx.lineTo(11, 5); ctx.closePath(); ctx.fill();
    ctx.fillStyle = DARK;
    ctx.beginPath(); ctx.moveTo(8, -3.2); ctx.lineTo(9.5, -0.5); ctx.lineTo(10.5, -3.8); ctx.fill();
    ctx.beginPath(); ctx.moveTo(8, 3.2); ctx.lineTo(9.5, 0.5); ctx.lineTo(10.5, 3.8); ctx.fill();
  } else {
    ctx.fillStyle = LIGHT;
    ctx.beginPath(); ctx.arc(10, -2, 0.9, 0, Math.PI * 2); ctx.fill();
    ctx.beginPath(); ctx.arc(10, 2, 0.9, 0, Math.PI * 2); ctx.fill();
  }

  // Augen
  ctx.fillStyle = LIGHT;
  ctx.beginPath(); ctx.arc(2, -5, 2.8, 0, Math.PI * 2); ctx.fill();
  ctx.beginPath(); ctx.arc(2, 5, 2.8, 0, Math.PI * 2); ctx.fill();
  ctx.fillStyle = DARK;
  const dead = state === 'over';
  if (dead) {
    ctx.strokeStyle = DARK; ctx.lineWidth = 1.2;
    [-5, 5].forEach(yy => {
      ctx.beginPath();
      ctx.moveTo(0.8, yy - 1.5); ctx.lineTo(3.2, yy + 1.5);
      ctx.moveTo(3.2, yy - 1.5); ctx.lineTo(0.8, yy + 1.5);
      ctx.stroke();
    });
  } else {
    ctx.beginPath(); ctx.arc(3, -5, 1.4, 0, Math.PI * 2); ctx.fill();
    ctx.beginPath(); ctx.arc(3, 5, 1.4, 0, Math.PI * 2); ctx.fill();
  }
  ctx.restore();
}

function centerText(lines) {
  ctx.fillStyle = 'rgba(155,188,15,.88)';
  ctx.fillRect(20, 110, 280, 100);
  ctx.fillStyle = DARK; ctx.textAlign = 'center';
  ctx.font = 'bold 24px "Courier New"';
  ctx.fillText(lines[0], 160, 150);
  ctx.font = '14px "Courier New"';
  ctx.fillText(lines[1], 160, 180);
}

function draw() {
  ctx.fillStyle = LIGHT;
  ctx.fillRect(0, 0, canvas.width, canvas.height);

  // dezentes Raster
  ctx.fillStyle = 'rgba(79,107,19,.12)';
  for (let x = 0; x < COLS; x++)
    for (let y = 0; y < ROWS; y++)
      if ((x + y) % 2) ctx.fillRect(x * SIZE, y * SIZE, SIZE, SIZE);

  if (!snake) { centerText(['SNAKE', 'Tippen zum Start']); return; }

  drawApple(food);
  for (let i = snake.length - 1; i >= 1; i--) {
    if (i === snake.length - 1) drawTail(snake[i], snake[i - 1]);
    else drawBody(snake[i], i);
  }
  drawHead();

  if (state === 'pause') centerText(['PAUSE', 'Tippen = weiter']);
  if (state === 'over') centerText(['GAME OVER', 'Punkte: ' + score + ' – Tippen']);
}

function tapAction() {
  if (scoresBox.style.display === 'block') return;
  if (state === 'pause') { resumeGame(); draw(); }
  else if (state !== 'play') { start(); }
}

/* ---------- Steuerung ---------- */
document.addEventListener('keydown', e => {
  const k = e.key;
  if (k === 'ArrowUp') turn(0, -1);
  else if (k === 'ArrowDown') turn(0, 1);
  else if (k === 'ArrowLeft') turn(-1, 0);
  else if (k === 'ArrowRight') turn(1, 0);
  else if (k === ' ' || k === 'Enter') { e.preventDefault(); tapAction(); }
  else if (k === 'p' || k === 'P') { if (state === 'play') { pauseGame(); draw(); } }
  else if (k === 'h' || k === 'H') showScores();
  else if (k === 'Escape') hideScores();
});

[['up',0,-1],['down',0,1],['left',-1,0],['right',1,0]].forEach(([id, dx, dy]) => {
  const el = document.getElementById(id);
  el.addEventListener('touchstart', e => { e.preventDefault(); turn(dx, dy); });
  el.addEventListener('mousedown', () => turn(dx, dy));
});

let tx, ty;
canvas.addEventListener('touchstart', e => {
  tx = e.touches[0].clientX; ty = e.touches[0].clientY;
  tapAction();
});
canvas.addEventListener('touchend', e => {
  const dx = e.changedTouches[0].clientX - tx;
  const dy = e.changedTouches[0].clientY - ty;
  if (Math.max(Math.abs(dx), Math.abs(dy)) < 20) return;
  if (Math.abs(dx) > Math.abs(dy)) turn(dx > 0 ? 1 : -1, 0);
  else turn(0, dy > 0 ? 1 : -1);
});
canvas.addEventListener('click', tapAction);

document.addEventListener('visibilitychange', () => {
  if (document.hidden && state === 'play') { pauseGame(); draw(); }
});

updateBest();
draw();

/* ---------- PWA: Service Worker ---------- */
if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => navigator.serviceWorker.register('sw.js'));
}
</script>
</body>
</html>
